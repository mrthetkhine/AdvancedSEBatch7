<html>
    <script src="https://cdn.jsdelivr.net/npm/ramda@0.30.0/dist/ramda.min.js"></script>
    <script>
      
      
      let MayBe = (value) => ({
        isEmpty(){
          return value == null || value == undefined;
        },
        map (fn){
          return this.isEmpty() ? MayBe(null) : MayBe(fn(value));
        },
        valueOf:()=>value
      });

      MayBe.of = MayBe;

      
      let employess = {
        1:{
          name : 'Jhon',
          
        },
        2:{
          name : 'Smith',
          supervisorId : 1
        },
        3:{
          name : 'Sara',
          supervisorId : 2
        }
      }
      function getSupervisor(employeeId)
      {
        let emp = employess[employeeId];
        if(emp)
        {
           let supervisorId = emp.supervisorId;
           if(supervisorId)
           {
             let supervisor = employess[supervisorId];
              if(supervisor)
              {
                return supervisor.name;
              }
           }
        }
      }
      function getSupervisorWithMayBe(employeeId)
      {
        return MayBe(employeeId)
                .map(id=>employess[id])
                .map(emp=>emp.supervisorId)
                .map(supervisorId=>employess[supervisorId])
                .map(supervisor=>supervisor.name)
                .valueOf();
      }
      console.log('getSupervisor(3) ',getSupervisor(3));
      console.log('getSupervisor(2) ',getSupervisor(2));
      console.log('getSupervisor(1) ',getSupervisor(1));
      console.log('getSupervisorWithMayBe(3) ',getSupervisorWithMayBe(3));
      console.log('getSupervisorWithMayBe(2) ',getSupervisorWithMayBe(2));
      console.log('getSupervisorWithMayBe(1) ',getSupervisorWithMayBe(1));
    </script>
</html>
