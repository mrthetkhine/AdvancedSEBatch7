<html>
    <script src="https://cdn.jsdelivr.net/npm/ramda@0.30.0/dist/ramda.min.js"></script>
    <script>
      
      // input * 3 /2 
      let fun = R.pipe(
        R.multiply(3), //(a,b)
        R.flip(R.divide)(2),// nput * 3 /2 
      );
      console.log('fun(4) ',fun(4));
      const even = x => x % 2 == 0;
      console.log('R.count(even, [1, 2, 3, 4, 5]) ',R.count(even, [1, 2, 3, 4, 5])); 

      console.log('R.identity(1) ',R.identity(1));
      const letters = ['a', 'b', 'A', 'a', 'B', 'c'];
      console.log('count by',R.countBy(R.toLower)(letters));   //=> {'a': 3, 'b': 2, 'c': 1}
    </script>
</html>
